<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drum Diaries Audio Player</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: Canvas;
      color: CanvasText;
    }

    main {
      width: min(640px, 100%);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      line-height: 1.1;
    }

    audio {
      width: 100%;
      margin: 8px 0 16px;
    }

    a {
      color: LinkText;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Drum Diaries Audio</h1>
    <audio id="player" controls preload="metadata">
      Your browser does not support the audio element.
    </audio>
    <p><a id="download" href="">Download audio file</a></p>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const audioPath = params.get("audio");
    const title = params.get("title");
    const player = document.getElementById("player");
    const download = document.getElementById("download");

    if (title) {
      document.getElementById("title").textContent = title;
      document.title = `${title} - Drum Diaries`;
    }

    if (audioPath && !audioPath.includes("://") && !audioPath.startsWith("/")) {
      player.src = audioPath;
      download.href = audioPath;
    } else {
      player.replaceWith("No audio file was selected.");
      download.remove();
    }
  </script>
</body>
</html>
